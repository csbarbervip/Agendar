<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0c0c0d;--card:#18181a;--line:#2a2a2d;--tx:#f2ede3;--mut:#9a948a;--gold:#d4a84b;--gold2:#b8862f;--red:#e5604d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:15px}
h1,h2,h3,.cond{font-family:Oswald,'Arial Narrow',Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:500;margin:0}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 16px 90px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{width:46px;height:46px;border-radius:10px;object-fit:cover;object-position:50% 45%;background:#000;border:1px solid var(--gold2)}
.big{display:block;width:210px;max-width:70%;margin:0 auto 14px;border-radius:16px}
.top small{color:var(--mut);display:block;font-size:11px;letter-spacing:.12em}
h2{font-size:22px;margin-bottom:4px;color:var(--gold)}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tap{cursor:pointer;transition:.15s}.tap:active{transform:scale(.98);border-color:var(--gold)}
.price{font-family:Oswald,sans-serif;color:var(--gold);font-size:19px}
.mut{color:var(--mut);font-size:13px}
label{display:block;font-size:12px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin:12px 0 5px}
input,select{width:100%;padding:13px;background:#111;border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit}
input:focus{outline:none;border-color:var(--gold)}
.btn{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;font-family:Oswald,sans-serif;font-size:16px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;margin-top:16px;display:block;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.btn.sm{width:auto;padding:8px 12px;font-size:12px;margin:0;display:inline-block}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.day{flex:0 0 58px;text-align:center;padding:10px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.day b{display:block;font-family:Oswald,sans-serif;font-size:20px;font-weight:500}
.day span{font-size:11px;color:var(--mut);text-transform:uppercase}
.day.on{border-color:var(--gold);background:#251f10}.day.on b{color:var(--gold)}
.day.off{opacity:.35;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:12px 0;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:Oswald,sans-serif;letter-spacing:.04em}
.slot:active,.slot.on{border-color:var(--gold);color:var(--gold)}
.slot.x{opacity:.3;text-decoration:line-through;pointer-events:none}
.slot.blk{border-color:var(--red);color:var(--red)}
nav{position:fixed;left:0;right:0;bottom:0;background:#101011;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 0 10px;font-family:Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase;font-size:12px;cursor:pointer}
nav button.on{color:var(--gold)}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}
.dot{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:Oswald,sans-serif;color:var(--mut)}
.dot.f{border:2px solid var(--gold);background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111}
.gift{background:#251f10;border:1px solid var(--gold);color:var(--gold);padding:12px;border-radius:12px;text-align:center;margin-bottom:12px;font-family:Oswald,sans-serif;letter-spacing:.06em}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--gold);color:var(--gold);margin-left:6px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.tabs button.on{border-color:var(--gold);color:var(--gold)}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:16px}
a{color:var(--gold)}
.back{background:none;border:0;color:var(--mut);cursor:pointer;padding:0 0 10px;font:inherit}
</style>
</head>

const mem={};
function ld(k,d){try{const v=localStorage.getItem(k);if(v)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:d}
function sv(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const $=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const brl=n=>n===0?'Grátis':'R$ '+n.toFixed(2).replace('.',',');
const DS=['dom','seg','ter','qua','qui','sex','sáb'];
const BARBER_WA='5564996266993';
const SLOTS=[];for(let h=9;h<19;h++){SLOTS.push(String(h).padStart(2,'0')+':00',String(h).padStart(2,'0')+':30')}
let services=ld('cs_services',[
 {id:'corte',name:'Corte de cabelo',price:35,dur:30,cut:true},
 {id:'barba',name:'Barba',price:30,dur:20,cut:false},
 {id:'sobr',name:'Sobrancelha',price:10,dur:15,cut:false},
 {id:'combo',name:'Combo completo',price:70,dur:60,cut:true}]);
let appts=ld('cs_appts',[]),blocked=ld('cs_blocked',{}),client=ld('cs_client',null);
const S={tab:'book',step:'svc',svc:null,date:iso(new Date()),time:null,last:null,adm:false,at:'hoje',ad:iso(new Date()),bd:iso(new Date())};
const days=()=>Array.from({length:14},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return d});
const busy=(d,t)=>appts.some(a=>a.date===d&&a.time===t&&a.status!=='cancelado');
const isBlk=(d,t)=>(blocked[d]||[]).includes(t);
function pts(){if(!client)return{done:0,left:0,free:0};
 const mine=appts.filter(a=>a.wa===client.wa);
 const done=mine.filter(a=>a.status==='concluido'&&a.cut).length+(client.stamps||0);
 const used=mine.filter(a=>a.free&&a.status!=='cancelado').length;
 return{done,left:done%10,free:Math.floor(done/10)-used}}
function head(t,s){return `<div class="top"><img class="logo" alt="CS" src="${LOGO}"><div class="cond" style="font-size:16px">CS Barber VIP<small>Atendimento no seu lugar, seu horário</small></div></div><h2>${t}</h2><p class="sub">${s||''}</p>`}
function maskWa(v){v=v.replace(/\D/g,'').slice(0,11);let o=v;if(v.length>2)o='('+v.slice(0,2)+') '+v.slice(2);if(v.length>7)o='('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7);return o}
function render(){
 const a=$('#app');
 $('#nav').innerHTML=client?[['book','Agendar'],['pts','Meus pontos']].map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';if(k==='book'&&S.step==='ok')S.step='svc';render()">${l}</button>`).join(''):'';
 if(!client){a.innerHTML=reg();return}
 a.innerHTML=S.tab==='book'?book():S.tab==='pts'?ptsView():admin();
}
function reg(){return `<img class="big" alt="Barbearia VIP Cláudio Souza" src="${LOGO}">`+head('Bem-vindo','Cadastro rápido para agendar em segundos.')+`
<label>Nome</label><input id="rn" placeholder="Seu nome" autocomplete="name">
<label>Data de nascimento</label><input id="rb" type="date">
<label>WhatsApp</label><input id="rw" inputmode="tel" placeholder="(64) 99999-9999" oninput="this.value=maskWa(this.value)">
<div class="err" id="re"></div><button class="btn" onclick="doReg()">Entrar</button>`}
function doReg(){const n=$('#rn').value.trim(),b=$('#rb').value,w=$('#rw').value.replace(/\D/g,'');
 if(n.length<2)return $('#re').textContent='Informe seu nome.';
 if(!b)return $('#re').textContent='Informe a data de nascimento.';
 if(w.length!==11||w[2]!=='9')return $('#re').textContent='WhatsApp inválido. Use DDD + 9 dígitos.';
 client={name:n,birth:b,wa:w};sv('cs_client',client);render()}
function book(){
 if(S.step==='ok'){const a=S.last,m=encodeURIComponent(`Olá, Cláudio! Sou ${a.name}. Quero agendar: ${a.svc} em ${fd(a.date)} às ${a.time} (${brl(a.price)}). Meu WhatsApp: ${maskWa(a.wa)}. Pode confirmar?`);
  return head('Quase lá!','Toque no botão abaixo para enviar o pedido ao Cláudio. O horário é confirmado por ele no WhatsApp.')+`<div class="card"><div class="cond" style="color:var(--gold)">${fd(a.date)} · ${a.time}</div><div class="mut">${a.svc} com Cláudio Souza</div></div>
  <a class="btn" target="_blank" rel="noopener" href="https://wa.me/${BARBER_WA}?text=${m}">Enviar pedido no WhatsApp</a>
  <button class="btn ghost" onclick="S.tab='pts';render()">Ver meus pontos</button>`}
 const prof=`<div class="card row" style="border-color:var(--gold)"><div><div class="cond">Cláudio Souza</div><div class="mut">Atendimento no seu lugar, seu horário</div></div><span class="tag">Profissional</span></div>`;
 const hi=client.name.split(' ')[0];
 if(S.step==='svc'){const p=pts();return head('Olá, '+hi,'Escolha o serviço.')+prof+services.map(s=>`<div class="card tap row" onclick="pickSvc('${s.id}')"><div><div style="font-weight:600">${s.name}${p.free>0&&s.id==='corte'?'<span class="tag">Grátis!</span>':''}</div><div class="mut">${s.dur} min</div></div><div class="price">${p.free>0&&s.id==='corte'?'R$ 0':brl(s.price)}</div></div>`).join('')}
 if(S.step==='time'){const now=new Date(),nt=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  return `<button class="back" onclick="S.step='svc';render()">← Serviços</button>`+head('Quando?',S.svc.name+' · '+S.svc.dur+' min')+`<div class="days">${days().map(d=>{const k=iso(d),off=d.getDay()===0;return `<div class="day ${k===S.date?'on':''} ${off?'off':''}" onclick="S.date='${k}';render()"><span>${DS[d.getDay()]}</span><b>${d.getDate()}</b></div>`}).join('')}</div>
  <div class="grid">${SLOTS.map(t=>{const x=busy(S.date,t)||isBlk(S.date,t)||(S.date===iso(now)&&t<=nt);return `<div class="slot ${x?'x':''}" onclick="pickTime('${t}')">${t}</div>`}).join('')}</div>`}
 if(S.step==='sum'){const p=pts(),free=p.free>0&&S.svc.id==='corte',v=free?0:S.svc.price;
  return `<button class="back" onclick="S.step='time';render()">← Horários</button>`+head('Resumo','Confira e confirme.')+`<div class="card">
  ${[['Data',fd(S.date)],['Hora',S.time],['Barbeiro','Cláudio Souza'],['Serviço',S.svc.name],['Duração',S.svc.dur+' min']].map(([a,b])=>`<div class="row" style="padding:6px 0"><span class="mut">${a}</span><b>${b}</b></div>`).join('')}
  <div class="row" style="padding-top:10px;border-top:1px solid var(--line);margin-top:6px"><span class="mut">Valor</span><span class="price">${brl(v)}</span></div></div>
  ${free?'<div class="gift">🎁 Corte grátis da fidelidade aplicado</div>':''}
  <button class="btn" onclick="confirmB(${free})">Confirmar agendamento</button>`}
}
const fd=k=>{const [y,m,d]=k.split('-').map(Number);return DS[new Date(y,m-1,d).getDay()]+', '+String(d).padStart(2,'0')+'/'+String(m).padStart(2,'0')};
function pickSvc(id){S.svc=services.find(s=>s.id===id);S.step='time';render()}
function pickTime(t){S.time=t;S.step='sum';render()}
function confirmB(free){const a={id:Date.now(),date:S.date,time:S.time,svc:S.svc.name,svcId:S.svc.id,cut:S.svc.cut,price:free?0:S.svc.price,dur:S.svc.dur,name:client.name,wa:client.wa,free:!!free,status:'agendado'};
 if(busy(a.date,a.time)){S.step='time';return render()}
 appts.push(a);sv('cs_appts',appts);S.last=a;S.step='ok';render()}
function stamp(){const v=$('#sp2').value;if(v==='8470'){client.stamps=(client.stamps||0)+1;sv('cs_client',client);render()}else{$('#sp2').value='';$('#sp2').placeholder='PIN incorreto'}}
function ptsView(){const p=pts();const mine=appts.filter(a=>a.wa===client.wa&&a.status==='agendado').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 return head('Meus pontos','A cada 10 cortes, o próximo é de graça.')+(p.free>0?'<div class="gift">🎁 Você tem um corte grátis disponível!</div>':'')+
 `<div class="card"><div class="row"><span class="cond">Cartão fidelidade</span><span class="price">${p.left}/10</span></div>
 <div class="dots">${Array.from({length:10},(_,i)=>`<div class="dot ${i<p.left?'f':''}">${i<p.left?'✂':i+1}</div>`).join('')}</div>
 <div class="mut">${p.done} cortes concluídos no total · faltam ${10-p.left} para o próximo grátis</div></div>
 <h3 style="margin:16px 0 8px;font-size:15px">Próximos agendamentos</h3>`+(mine.length?mine.map(a=>`<div class="card row"><div><b>${a.svc}</b><div class="mut">${fd(a.date)} · ${a.time}</div></div><div class="price">${brl(a.price)}</div></div>`).join(''):'<div class="mut">Nenhum agendamento.</div>')+`<div class="card"><div class="mut">Só o barbeiro: após o corte, digite o PIN para carimbar.</div><input id="sp2" type="password" inputmode="numeric" placeholder="PIN do barbeiro" style="margin-top:10px"><button class="btn sm" style="margin-top:8px" onclick="stamp()">Carimbar corte</button></div><button class="btn ghost" onclick="client=null;sv('cs_client',null);render()">Sair</button>`}
function admin(){
 if(!S.adm)return head('Área restrita','Acesso do barbeiro.')+`<label>PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><div class="err" id="pe"></div><button class="btn" onclick="if($('#pin').value==='8470'){S.adm=true;render()}else $('#pe').textContent='PIN incorreto.'">Entrar</button>`;
 const t=[['hoje','Agenda'],['bloq','Bloquear'],['serv','Serviços']];
 let h=head('Painel','Cláudio Souza')+`<div class="tabs">${t.map(([k,l])=>`<button class="${S.at===k?'on':''}" onclick="S.at='${k}';render()">${l}</button>`).join('')}</div>`;
 if(S.at==='hoje'){const l=appts.filter(a=>a.date===S.ad&&a.status!=='cancelado').sort((a,b)=>a.time.localeCompare(b.time));
  h+=`<input type="date" value="${S.ad}" onchange="S.ad=this.value;render()" style="margin-bottom:12px">`+(l.length?l.map(a=>`<div class="card"><div class="row"><div><span class="price">${a.time}</span> <b>${a.name}</b></div><span class="tag">${a.status}</span></div><div class="mut">${a.svc} · ${brl(a.price)}${a.free?' · fidelidade':''}</div><div class="row" style="margin-top:10px;justify-content:flex-start;flex-wrap:wrap"><a class="btn sm ghost" target="_blank" rel="noopener" href="https://wa.me/55${a.wa}">WhatsApp</a>${a.status==='agendado'?`<button class="btn sm" onclick="setSt(${a.id},'concluido')">Concluir</button><button class="btn sm ghost" style="color:var(--red);border-color:var(--red)" onclick="setSt(${a.id},'cancelado')">Cancelar</button>`:''}</div></div>`).join(''):'<div class="mut">Sem agendamentos neste dia.</div>')+`<p class="mut">Ao concluir um corte, o cliente soma 1 ponto.</p>`}
 if(S.at==='bloq')h+=`<input type="date" value="${S.bd}" onchange="S.bd=this.value;render()" style="margin-bottom:12px"><p class="mut">Toque para bloquear/liberar.</p><div class="grid">${SLOTS.map(x=>`<div class="slot ${isBlk(S.bd,x)?'blk':''} ${busy(S.bd,x)?'x':''}" onclick="togB('${x}')">${x}</div>`).join('')}</div>`;
 if(S.at==='serv')h+=services.map(s=>`<div class="card row"><div><b>${s.name}</b><div class="mut">${s.dur} min${s.cut?' · conta ponto':''}</div></div><div class="price">${brl(s.price)}</div></div>`).join('')+`<h3 style="margin:16px 0 4px;font-size:15px">Novo serviço</h3><label>Nome</label><input id="sn"><label>Preço (R$)</label><input id="sp" inputmode="decimal"><label>Duração (min)</label><input id="sd" inputmode="numeric"><label style="display:flex;gap:8px;align-items:center;text-transform:none"><input id="sc" type="checkbox" style="width:auto"> Conta como corte (pontos)</label><button class="btn" onclick="addSvc()">Cadastrar serviço</button>`;
 return h+`<button class="btn ghost" onclick="S.adm=false;render()">Sair do painel</button>`}
function setSt(id,st){const a=appts.find(x=>x.id===id);a.status=st;sv('cs_appts',appts);render()}
function togB(t){const l=blocked[S.bd]||[];blocked[S.bd]=l.includes(t)?l.filter(x=>x!==t):[...l,t];sv('cs_blocked',blocked);render()}
function addSvc(){const n=$('#sn').value.trim(),p=parseFloat($('#sp').value.replace(',','.')),d=parseInt($('#sd').value);if(!n||isNaN(p)||isNaN(d))return;services.push({id:'s'+Date.now(),name:n,price:p,dur:d,cut:$('#sc').checked});sv('cs_services',services);render()}
render();
</script>
</body>
</html>
